# Wav2Vec2 Fine-tuning Configuration

# Model settings
model:
  name: "jonatasgrosman/wav2vec2-large-xlsr-53-persian"
  
# Data paths
data:
  audio_files_dir: "dataset/audio_files"
  json_info_dir: "dataset/info"
  test_audio_dir: "dataset/test_audio"
  train_val_split: 0.8  # 80% train, 20% validation

# Training hyperparameters
training:
  batch_size: 4  # Increased from 1 for better GPU utilization (adjust if OOM errors occur)
  num_epochs: 5  # Increased from 2 for better convergence
  learning_rate: 0.0003  # 3e-4
  weight_decay: 0.001
  warmup_steps: 100
  gradient_accumulation_steps: 4  # Effectively increases batch size to 16 (4 * 4)
  max_audio_length: 15.0  # Maximum audio length in seconds (None for no limit)
  num_workers: 4  # DataLoader workers (increased for better data loading performance)
  # Learning rate scheduling
  use_reduce_lr_on_plateau: true  # Reduce LR when validation WER plateaus
  reduce_lr_patience: 2  # Number of epochs with no improvement before reducing LR
  reduce_lr_factor: 0.5  # Factor to reduce LR by
  reduce_lr_min: 1e-6  # Minimum learning rate
  # Early stopping
  early_stopping_patience: 3  # Number of epochs with no improvement before stopping
  early_stopping_min_delta: 0.001  # Minimum change to qualify as improvement
  # Optimization
  gradient_clip_norm: 1.0  # Max norm for gradient clipping (prevents exploding gradients)
  random_seed: 42  # Random seed for reproducibility (train/val split, shuffling)

# Inference settings
inference:
  chunk_duration: 30  # Duration of each chunk in seconds for long audio
  skip_short_chunks: true  # Skip very short chunks (< 0.1 seconds)
  min_chunk_samples: 1000  # Minimum samples for a chunk to be processed
  # Model diagnostics
  blank_token_threshold: 0.95  # Threshold for warning about excessive blank predictions
  
# Output settings
output:
  output_dir: "outputs"
  save_every_n_epochs: 1  # Save checkpoint every N epochs
  log_file: "outputs/training.log"  # Path to log file (set to null for no file logging)
  log_level: "INFO"  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  
# Device settings
device:
  use_cuda: true  # Automatically use CUDA if available
  mixed_precision: true  # Use mixed precision training (fp16) for faster training and lower memory usage
  empty_cache_after_val: true  # Clear GPU cache after validation to free memory

