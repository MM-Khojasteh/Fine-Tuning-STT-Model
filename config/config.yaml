# ==============================================================================
# Wav2Vec2 Fine-tuning Configuration (public schema)
#
# IMPORTANT: This file intentionally contains only safe, generic defaults.
# The operational/tuned values that make this pipeline produce its results
# (dataset locations, tuned hyperparameters, thresholds and toggles) are
# supplied via environment variables - typically a local .env file that is
# NEVER committed. See .env.example for the full documented variable matrix.
#
# Precedence (highest wins):
#   1. Real environment variables
#   2. Local .env file values
#   3. The defaults in this file
# ==============================================================================

# Model settings
model:
  # Public base checkpoint; override with WAV2VEC2_MODEL_NAME.
  name: "jonatasgrosman/wav2vec2-large-xlsr-53-persian"

# Data paths (override with WAV2VEC2_AUDIO_FILES_DIR / WAV2VEC2_JSON_INFO_DIR /
# WAV2VEC2_TEST_AUDIO_DIR / WAV2VEC2_TRAIN_VAL_SPLIT)
data:
  audio_files_dir: "dataset/audio_files"
  json_info_dir: "dataset/info"
  test_audio_dir: "dataset/test_audio"
  train_val_split: 0.8  # 80% train, 20% validation

# Training hyperparameters (override with WAV2VEC2_* training variables)
training:
  batch_size: 2
  num_epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_steps: 0
  gradient_accumulation_steps: 1
  max_audio_length: null  # Maximum audio length in seconds (null for no limit)
  num_workers: 2
  # Learning rate scheduling
  use_reduce_lr_on_plateau: false  # Reduce LR when validation WER plateaus
  reduce_lr_patience: 2  # Number of epochs with no improvement before reducing LR
  reduce_lr_factor: 0.5  # Factor to reduce LR by
  reduce_lr_min: 1.0e-6  # Minimum learning rate (note: dotted exponent required for YAML float)
  # Early stopping
  early_stopping_patience: null  # Epochs with no improvement before stopping (null disables)
  early_stopping_min_delta: 0.001  # Minimum change to qualify as improvement
  # Optimization
  gradient_clip_norm: 1.0  # Max norm for gradient clipping (prevents exploding gradients)
  random_seed: 42  # Random seed for reproducibility (train/val split, shuffling)

# Inference settings (chunk_duration is read by inference.py; the remaining
# keys are reserved schema placeholders, override with WAV2VEC2_* variables)
inference:
  chunk_duration: 30  # Duration of each chunk in seconds for long audio
  skip_short_chunks: true  # Skip very short chunks (< 0.1 seconds)
  min_chunk_samples: 1000  # Minimum samples for a chunk to be processed
  # Model diagnostics
  blank_token_threshold: 0.95  # Threshold for warning about excessive blank predictions

# Output settings (override with WAV2VEC2_OUTPUT_DIR / WAV2VEC2_LOG_FILE /
# WAV2VEC2_LOG_LEVEL; save_every_n_epochs is a reserved schema placeholder)
output:
  output_dir: "outputs"
  save_every_n_epochs: 1  # Save checkpoint every N epochs
  log_file: "outputs/training.log"  # Path to log file (null for no file logging)
  log_level: "INFO"  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL

# Device settings (override with WAV2VEC2_USE_CUDA / WAV2VEC2_MIXED_PRECISION /
# WAV2VEC2_EMPTY_CACHE_AFTER_VAL)
device:
  use_cuda: true  # Automatically use CUDA if available
  mixed_precision: true  # Mixed precision training (fp16) for speed and lower memory
  empty_cache_after_val: true  # Clear GPU cache after validation to free memory
